# Python versions supported by Odoo 18.0 (3.10-3.14), 19.0 (3.10-3.14) and 20.0 (3.12-3.14).
# Run with: uvx --with tox-uv tox
[tox]
requires = tox>=4.22
env_list = py3{10,11,12,13,14}, lint

[testenv]
description = run the tests
dependency_groups = test
commands = pytest {posargs}

[testenv:lint]
description = ruff lint and format check
skip_install = true
dependency_groups =
deps = ruff
commands =
    ruff check .
    ruff format --check .
