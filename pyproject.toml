[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "json-plain-float"
version = "1.0.0"
description = "JSON encoder writing floats in plain decimal notation, never in scientific notation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"  # Odoo 18.0 and 19.0 support 3.10+, Odoo 20.0 3.12+
authors = [{ name = "Camptocamp", email = "info@camptocamp.com" }]
maintainers = [{ name = "Simone Orsi", email = "simone.orsi@camptocamp.com" }]
keywords = ["json", "float", "scientific notation", "decimal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/camptocamp/json-plain-float"

[dependency-groups]
test = ["pytest"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D103"]
